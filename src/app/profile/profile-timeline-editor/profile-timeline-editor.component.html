<div class="timeline-editor-container">
  <!-- Botão para adicionar item -->
  <div class="add-item-section">
    <ion-button 
      expand="block" 
      color="primary"
      (click)="openAddItemModal()"
      class="add-item-button">
      <ion-icon name="add-circle-outline" slot="start"></ion-icon>
      Adicionar item à timeline
    </ion-button>
  </div>

  <!-- Lista de itens da timeline -->
  <div class="timeline-list" *ngIf="timelineItems.length > 0">
    <ion-card 
      *ngFor="let item of timelineItems" 
      class="timeline-item-card">
      
      <!-- Cabeçalho do card com data e ações -->
      <ion-card-header>
        <div class="card-header-content">
          <div class="item-date">
            <ion-icon name="calendar-outline"></ion-icon>
            <span>{{ formatDate(item.createdAt) }}</span>
          </div>
          <div class="item-actions">
            <ion-button 
              fill="clear" 
              size="small"
              (click)="openEditItemModal(item)"
              class="action-button">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button 
              fill="clear" 
              size="small"
              color="danger"
              (click)="deleteItem(item)"
              class="action-button">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </div>
      </ion-card-header>

      <!-- Conteúdo do card -->
      <ion-card-content>
        <!-- Texto -->
        <div class="item-text" *ngIf="item.text">
          <p>{{ item.text }}</p>
        </div>

        <!-- Imagem -->
        <div class="item-image" *ngIf="item.imageUrl">
          <img [src]="item.imageUrl" alt="Timeline image" />
        </div>

        <!-- Vídeo -->
        <div class="item-video" *ngIf="item.videoUrl">
          <div *ngIf="isYouTubeUrl(item.videoUrl)" class="youtube-video">
            <iframe 
              [src]="getYouTubeEmbedUrl(item.videoUrl) | safe"
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
          <div *ngIf="!isYouTubeUrl(item.videoUrl)" class="video-url">
            <ion-icon name="videocam-outline"></ion-icon>
            <a [href]="item.videoUrl" target="_blank">{{ item.videoUrl }}</a>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Mensagem quando não há itens -->
  <div class="empty-state" *ngIf="timelineItems.length === 0">
    <ion-icon name="images-outline" class="empty-icon"></ion-icon>
    <p class="empty-message">Nenhum item na timeline ainda.</p>
    <p class="empty-submessage">Clique no botão acima para adicionar seu primeiro item!</p>
  </div>
</div>
