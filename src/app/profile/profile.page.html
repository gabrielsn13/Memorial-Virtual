<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-container">
    

    <!-- Hidden Input for Profile Image -->
    <input 
      #profileImageInput
      type="file" 
      accept="image/*"
      style="display: none;"
      (change)="onProfileImageSelected($event)">

    <!-- Banner Section -->
    <div class="banner-section">
      <div class="banner-image">
        <div class="profile-image-banner" (click)="openProfileImageMenu()">
          <img [src]="userProfile.profileImage" alt="Profile" class="banner-profile-img">
          <div class="profile-image-overlay">
            <ion-icon name="camera-outline" class="camera-icon"></ion-icon>
          </div>
        </div>
        <div class="banner-content">
          <h1 class="banner-name">{{ userProfile.name }}</h1>
          <div class="social-icons">
            <ion-icon name="mail-outline"></ion-icon>
            <ion-icon name="logo-facebook"></ion-icon>
            <ion-icon name="logo-twitter"></ion-icon>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="profile-tabs">
      <div 
        class="tab-item"
        [class.active]="activeTab === 'profile'"
        (click)="selectTab('profile')">
        <ion-icon name="person-outline"></ion-icon>
        <span>Profile</span>
      </div>
      <div 
        class="tab-item"
        [class.active]="activeTab === 'timeline'"
        (click)="selectTab('timeline')">
        <ion-icon name="images-outline"></ion-icon>
        <span>timeline</span>
      </div>
      <div 
        class="tab-item"
        [class.active]="activeTab === 'keeper'"
        (click)="selectTab('keeper')">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <span>Keeper</span>
      </div>
      <div 
        class="tab-item"
        [class.active]="activeTab === 'family'"
        (click)="selectTab('family')">
        <ion-icon name="home-outline"></ion-icon>
        <span>Family</span>
      </div>
      <div 
        class="tab-item"
        [class.active]="activeTab === 'events'"
        (click)="selectTab('events')">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>Events</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="profile-main">
      <div class="content-wrapper">
        
        <!-- Profile Tab -->
        <div class="tab-content" *ngIf="activeTab === 'profile'">
          <div class="decorative-element">
            <ion-icon name="flower-outline" class="flower-icon"></ion-icon>
          </div>
          
          <h2 class="profile-title">{{ userProfile.name }}</h2>
          
          <div class="dates-section">
            <div class="date-input-item">
              <label class="date-label">Birth Date</label>
              <p-datepicker 
                [(ngModel)]="userProfile.birthDate"
                [showIcon]="true"
                dateFormat="dd.mm.yy"
                placeholder="Select birth date"
                [maxDate]="maxDate"
                styleClass="afteer-datepicker"
                inputStyleClass="afteer-datepicker-input">
              </p-datepicker>
            </div>
            
            <div class="date-input-item">
              <label class="date-label">Death Date</label>
              <p-datepicker 
                [(ngModel)]="userProfile.deathDate"
                [showIcon]="true"
                dateFormat="dd.mm.yy"
                placeholder="Select death date"
                [maxDate]="maxDate"
                styleClass="afteer-datepicker"
                inputStyleClass="afteer-datepicker-input">
              </p-datepicker>
            </div>
          </div>

          <p class="memory-text">{{ userProfile.message }}</p>

          <div class="biography-section">
            <h3 class="section-title">Biography</h3>
            <ion-textarea 
              [(ngModel)]="userProfile.biography"
              rows="10"
              style="color: #000000 !important;"
              placeholder="Write the biography here..."
              class="biography-textarea">
            </ion-textarea>
          </div>

          <ion-button 
            class="save-button"
            (click)="saveProfile()"
            expand="block">
            Save Changes
          </ion-button>
        </div>

        <!-- timeline Tab -->
        <div class="tab-content" *ngIf="activeTab === 'timeline'">
          <app-profile-timeline-editor></app-profile-timeline-editor>
        </div>

        <!-- Keeper Tab -->
        <div class="tab-content" *ngIf="activeTab === 'keeper'">
          <h3 class="section-title">Keeper Settings</h3>
          <p class="info-text">Manage who can view and edit your memorial.</p>
          <!-- Implementar configurações de privacidade -->
        </div>

        <!-- Family Tab -->
        <div class="tab-content" *ngIf="activeTab === 'family'">
          <h3 class="section-title">Family</h3>
          <p class="info-text">Manage family members and relationships.</p>
          <!-- Implementar gerenciamento de família -->
        </div>

        <!-- Events Tab -->
        <div class="tab-content" *ngIf="activeTab === 'events'">
          <h3 class="section-title">Events</h3>
          <p class="info-text">Create and manage memorial events.</p>
          <!-- Implementar gerenciamento de eventos -->
        </div>

      </div>

    </div>

  </div>
</ion-content>
