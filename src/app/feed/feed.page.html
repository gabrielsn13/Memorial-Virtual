<ion-content [fullscreen]="true" class="feed-content">
  <div class="feed-container">
    <!-- Year Selector Scroll -->
    <div class="year-selector-container">
      <!-- Search Input (aparece quando showSearch está true) -->
      <div class="year-selector-header" *ngIf="showSearch">
        <div class="year-search-container">
          <ion-icon name="search-outline" class="search-icon"></ion-icon>
          <ion-input 
            type="number" 
            [(ngModel)]="searchYear"
            (ionInput)="onYearSearch()"
            placeholder="Search year..."
            class="year-search-input"
            min="1821"
            [max]="currentYear">
          </ion-input>
          <ion-button 
            *ngIf="searchYear"
            fill="clear" 
            class="clear-button"
            (click)="clearYearSearch()">
            <ion-icon name="close-circle" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button 
            fill="clear" 
            class="close-search-button"
            (click)="toggleSearch()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
      
      <div class="year-selector-wrapper">
        <!-- Search Icon Button (fixo à esquerda) -->
        <div 
          class="search-icon-button"
          (click)="toggleSearch()"
          *ngIf="!showSearch">
          <ion-icon name="search-outline"></ion-icon>
        </div>
        
        <div class="year-selector-scroll">
          <div 
            *ngFor="let year of availableYears" 
            class="year-item"
            [class.active]="selectedYear === year"
            [attr.data-year]="year"
            (click)="selectYear(year)">
            {{ year }}
          </div>
        </div>
      </div>
    </div>

    <div class="profiles-list">
      <div 
        *ngIf="profiles.length === 0" 
        class="no-profiles-message">
        <p>No profiles found for {{ selectedYear }}</p>
      </div>
      
      <div 
        *ngFor="let profile of profiles" 
        class="profile-card"
        (click)="openProfile(profile.id)">
        
        <!-- Profile Image -->
        <div class="profile-image-container">
          <img [src]="profile.imageUrl" [alt]="profile.name" class="profile-image">
        </div>

        <!-- Name -->
        <div class="profile-name-container">
          <h2 class="profile-name">{{ profile.name }}</h2>
          <div class="public-figure-badge" *ngIf="profile.isPublicFigure || profile.isHistoricalFigure">
            <ion-icon name="star" class="badge-icon"></ion-icon>
            <span class="badge-text">Historical Figure</span>
          </div>
        </div>

        <!-- Dates -->
        <div class="dates-container">
          <div class="date-box">
            <span class="date-icon">*</span>
            <span class="date-text">{{ profile.birthDate }}</span>
          </div>
          <div class="date-box">
            <span class="date-icon">+</span>
            <span class="date-text">{{ profile.deathDate }}</span>
          </div>
        </div>

        <!-- Message Box -->
        <div class="message-box">
          <p class="message-text">{{ profile.message }}</p>
          <p class="relationship-text">{{ profile.relationship }}</p>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav-bar">
    <div class="nav-item active" (click)="navigateToFeed()">
      <ion-icon name="home"></ion-icon>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" (click)="navigateToFriends()">
      <ion-icon name="people"></ion-icon>
      <span class="nav-label">Family</span>
    </div>
    <div class="nav-item nav-item-center" (click)="navigateToCreate()">
      <div class="center-button">
        <ion-icon name="add"></ion-icon>
      </div>
    </div>
    <div class="nav-item" (click)="navigateToProfile()">
      <ion-icon name="person"></ion-icon>
      <span class="nav-label">Profile</span>
    </div>
    <div class="nav-item" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon>
      <span class="nav-label">Log out</span>
    </div>
  </div>
</ion-content>
