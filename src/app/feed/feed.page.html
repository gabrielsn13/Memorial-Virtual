<ion-content [fullscreen]="true" class="feed-content">
  <div class="feed-container">
    <div class="profiles-list">
      <div 
        *ngFor="let profile of profiles" 
        class="profile-card"
        (click)="openProfile(profile.id)">
        
        <!-- Profile Image -->
        <div class="profile-image-container">
          <img [src]="profile.imageUrl" [alt]="profile.name" class="profile-image">
        </div>

        <!-- Name -->
        <h2 class="profile-name">{{ profile.name }}</h2>

        <!-- Dates -->
        <div class="dates-container">
          <div class="date-box">
            <span class="date-icon">*</span>
            <span class="date-text">{{ profile.birthDate }}</span>
          </div>
          <div class="date-box">
            <span class="date-icon">+</span>
            <span class="date-text">{{ profile.deathDate }}</span>
          </div>
        </div>

        <!-- Message Box -->
        <div class="message-box">
          <p class="message-text">{{ profile.message }}</p>
          <p class="relationship-text">{{ profile.relationship }}</p>
        </div>

      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav-bar">
    <div class="nav-item active" (click)="navigateToFeed()">
      <ion-icon name="home"></ion-icon>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" (click)="navigateToFriends()">
      <ion-icon name="people"></ion-icon>
      <span class="nav-label">Family</span>
    </div>
    <div class="nav-item nav-item-center" (click)="navigateToCreate()">
      <div class="center-button">
        <ion-icon name="add"></ion-icon>
      </div>
    </div>
    <div class="nav-item" (click)="navigateToInbox()">
      <ion-icon name="mail"></ion-icon>
      <span class="nav-label">Inbox</span>
    </div>
    <div class="nav-item" (click)="navigateToProfile()">
      <ion-icon name="person"></ion-icon>
      <span class="nav-label">Profile</span>
    </div>
  </div>
</ion-content>
